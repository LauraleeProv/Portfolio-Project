<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Construction</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #fff0f6;
      font-family: 'Quicksand', sans-serif;
      color: #4a2033;
      text-align: center;
      margin: 0;
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }

    .card {
      background-color: #ffffff;
      border: 2px solid #ff69b4;
      border-radius: 30px;
      padding: 40px 30px;
      max-width: 500px;
      box-shadow: 0 4px 15px rgba(255, 105, 180, 0.2);
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 4rem;
      color: #ff1493;
      margin: 0 0 15px 0;
      font-weight: normal;
    }

    p {
      font-size: 1.15rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    a.back-btn {
      display: inline-block;
      background-color: #ff69b4;
      color: #ffffff;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 25px;
      transition: background-color 0.2s ease;
    }

    a.back-btn:hover {
      background-color: #ff1493;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Under Construction</h1>
    <p>This page is currently being designed and updated. Check back soon to see what is new!</p>
    <a class="back-btn" href="index.html">Back to Portfolio</a>
  </div>

</body>
</html>
